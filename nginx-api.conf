# Reverse proxy for api.inferenceindexer.ai
# Proxies requests to the local FastAPI/uvicorn service on port 8000.
# HTTPS terminated here (via Let's Encrypt cert once DNS resolves).

server {
    listen 80;
    server_name api.inferenceindexer.ai;

    # Production: certbot will enable 443 + redirect after DNS resolves.

    location /mcp {
        proxy_pass http://127.0.0.1:8899/mcp;
        proxy_http_version 1.1;
        # mcp streamable-http validates the Host header; pass the backend's own
        # host so it accepts the request. Original domain is preserved via
        # X-Forwarded-Host for any downstream use.
        proxy_set_header Host 127.0.0.1:8899;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}