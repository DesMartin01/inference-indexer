<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Gold accent line at top -->
  <rect x="0" y="0" width="1200" height="4" fill="#C4A038"/>
  
  <!-- Logo/brand -->
  <text x="80" y="120" font-family="monospace" font-size="28" fill="#C4A038" letter-spacing="2">InferenceIndexer.ai</text>
  
  <!-- Main headline -->
  <text x="80" y="240" font-family="sans-serif" font-size="64" font-weight="700" fill="#ffffff">AI Inference</text>
  <text x="80" y="310" font-family="sans-serif" font-size="64" font-weight="700" fill="#C4A038">Price Index</text>
  
  <!-- SIT price -->
  <text x="80" y="400" font-family="monospace" font-size="22" fill="#8a8a8a">SIT-Composite</text>
  <text x="80" y="450" font-family="monospace" font-size="48" font-weight="600" fill="#ffffff">$3.09<tspan font-size="24" fill="#8a8a8a"> /M tokens</tspan></text>
  
  <!-- Stats -->
  <text x="80" y="540" font-family="sans-serif" font-size="20" fill="#8a8a8a">316 models tracked across 76 providers</text>
  <text x="80" y="570" font-family="sans-serif" font-size="20" fill="#8a8a8a">Live pricing, SIT scores, free API access</text>
  
  <!-- Right side decorative element -->
  <g transform="translate(850, 200)">
    <circle cx="150" cy="120" r="100" fill="none" stroke="#C4A038" stroke-width="2" opacity="0.3"/>
    <circle cx="150" cy="120" r="70" fill="none" stroke="#C4A038" stroke-width="2" opacity="0.5"/>
    <circle cx="150" cy="120" r="40" fill="none" stroke="#C4A038" stroke-width="2" opacity="0.7"/>
    <text x="150" y="130" text-anchor="middle" font-family="monospace" font-size="32" font-weight="700" fill="#C4A038">SIT</text>
  </g>
  
  <!-- Bottom accent -->
  <rect x="0" y="626" width="1200" height="4" fill="#C4A038" opacity="0.5"/>
</svg>
