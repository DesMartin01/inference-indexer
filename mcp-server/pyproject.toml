[project]
name = "inferenceindexer-mcp"
version = "0.3.0"
description = "MCP server exposing InferenceIndexer pricing data as agent tools."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "ai", "inference", "pricing", "llm", "agent", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # >=1.30.0: CVE-2026-59951 (session fix). Stay <2: mcp 2.x renamed
    # FastMCP -> MCPServer, which breaks this server's imports.
    "mcp>=1.30.0,<2",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://www.inferenceindexer.ai/for-agents"
Documentation = "https://www.inferenceindexer.ai/api-docs"
Repository = "https://github.com/desmartin01/inferenceindexer-mcp"

[project.scripts]
inferenceindexer-mcp = "inferenceindexer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inferenceindexer_mcp"]